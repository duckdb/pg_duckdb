name: Other extensions
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel in-progress jobs if a new commit is pushed to the same branch (except for main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  test-with-extension:
    name: "Test with ${{ matrix.name }} ${{ matrix.version }}"
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: TimescaleDB
          # The name of the extension in CREATE EXTENSION
          extension: timescaledb
          # The extensions whose tests have to run, see require_extension
          required_extensions: timescaledb
          repository: https://github.com/timescale/timescaledb.git
          version: 2.32.0
        - name: Citus
          extension: citus
          required_extensions: citus,citus_columnar
          repository: https://github.com/citusdata/citus.git
          version: v14.3.0
        - name: pgvector
          extension: vector
          required_extensions: vector
          repository: https://github.com/pgvector/pgvector.git
          version: v0.8.7

    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}

    env:
      PG_VERSION: REL_18_STABLE
      DUCKDB_BUILD: Release

    steps:
      - name: Test details
        run: echo Test pg_duckdb with ${{ matrix.name }} ${{ matrix.version }} and PostgreSQL ${{ env.PG_VERSION }} branch

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev \
            libssl-dev libxml2-utils xsltproc pkg-config libc++-dev libc++abi-dev libglib2.0-dev libtinfo6 cmake \
            libstdc++-12-dev ninja-build libcurl4-openssl-dev liblz4-dev libzstd-dev libsnappy-dev liblzma-dev
          echo "${PWD}/postgres/inst/bin" >> $GITHUB_PATH

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ env.PG_VERSION }}
          create-symlink: true

      - name: Checkout pg_duckdb extension code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          path: duckdb

      - name: Checkout PostgreSQL code
        run: |
          rm -rf postgres
          git clone --branch ${{ env.PG_VERSION }} --single-branch --depth 1 https://github.com/postgres/postgres.git

      - name: Compute Version SHAs
        id: versions
        run: |
          pushd duckdb/third_party/duckdb
          DUCKDB_SHA=`git rev-parse HEAD`
          echo "duckdb_sha=${DUCKDB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got DUCKDB_SHA='${DUCKDB_SHA}'"
          popd
          pushd postgres
          POSTGRES_SHA=`git rev-parse HEAD`
          echo "postgres_sha=${POSTGRES_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got POSTGRES_SHA='${POSTGRES_SHA}'"

      # Only restore the Postgres build of the "CI" workflow, never save it, because
      # the other extension is installed into it below. Otherwise that workflow
      # would also find the other extension.
      - name: Restore PG build cache
        id: cache-pg-build
        uses: actions/cache/restore@v6
        with:
          path: postgres/inst
          key: pg-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.postgres_sha }}-postgres_fdw

      - name: Build PostgreSQL code
        if: steps.cache-pg-build.outputs.cache-hit != 'true'
        working-directory: postgres
        run: |
          ./configure --prefix=$PWD/inst/ --enable-cassert --enable-debug --with-openssl --with-icu --with-libxml --with-lz4
          make -j8 install
          make -C contrib/postgres_fdw install

      - name: Setup DuckDB build cache
        id: cache-duckdb-build
        uses: actions/cache@v6
        with:
          path: duckdb/third_party/duckdb/build/
          key: duckdb-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.duckdb_sha }}-${{ env.DUCKDB_BUILD }}-${{ hashFiles('duckdb/Makefile', 'duckdb/third_party/pg_duckdb_extensions.cmake') }}-cmake4-ninja

      - name: Install pytest and other test requirements
        run: python -m pip install --user --break-system-packages -r duckdb/requirements.txt

      # The CMake 3.28 of Ubuntu 24.04 does not raise the policies of the old CMake projects avro uses (jansson), so it
      # ignores the hidden symbol visibility of jansson, see third_party/pg_duckdb_extensions.cmake
      - name: Install CMake 4
        run: python -m pip install --user --break-system-packages 'cmake>=4.0,<5'

      - name: Add user pip to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build pg_duckdb extension
        working-directory: duckdb
        run: ERROR_ON_WARNING=1 make -j8 install

      - name: Build ${{ matrix.name }} ${{ matrix.version }}
        run: |
          git clone --branch ${{ matrix.version }} --depth 1 ${{ matrix.repository }} other_extension
          cd other_extension
          PG_CONFIG=$GITHUB_WORKSPACE/postgres/inst/bin/pg_config
          case "${{ matrix.extension }}" in
            timescaledb)
              ./bootstrap -DPG_CONFIG=$PG_CONFIG -DCMAKE_BUILD_TYPE=Release -DREGRESS_CHECKS=OFF -DTAP_CHECKS=OFF \
                -DWARNINGS_AS_ERRORS=OFF -DGENERATE_DOWNGRADE_SCRIPT=OFF
              make -C build -j8 install
              ;;
            citus)
              ./configure PG_CONFIG=$PG_CONFIG --without-libcurl
              make -j8 install
              ;;
            vector)
              make -j8 install PG_CONFIG=$PG_CONFIG
              ;;
          esac

      # PG_DUCKDB_REQUIRED_EXTENSIONS makes the tests of the extension fail
      # instead of being skipped if it isn't installed correctly.
      - name: Run the tests with other extensions
        working-directory: duckdb
        env:
          PG_DUCKDB_REQUIRED_EXTENSIONS: ${{ matrix.required_extensions }}
        run: make pycheck PYTEST_ARGS=$PWD/test/pycheck/other_extensions_test.py
