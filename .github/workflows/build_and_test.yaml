name: CI
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel in-progress jobs if a new commit is pushed to the same branch (except for main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  format:
    name: "Linting and formatting"
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout pg_duckdb extension code
        uses: actions/checkout@v7
      - name: Fetch main branch
        run: git fetch --depth=1 origin +main:refs/remotes/origin/main
      - name: Install clang-format and ruff
        run: python -m pip install --user --break-system-packages -r dev_requirements.txt
      - name: Add user pip to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run clang-format
        run: find src include -iname '*.hpp' -o -iname '*.h' -o -iname '*.cpp' -o -iname '*.c' | xargs git clang-format --diff origin/main
      - name: Run ruff check
        run: ruff check --output-format=github .
      - name: Run ruff format
        run: ruff format --diff
      - name: Check regression test schedule
        run: ./scripts/schedule-check.sh

  build-and-test:
    name: "Build and test"
    strategy:
      fail-fast: false
      matrix:
        include:
        - version: REL_14_STABLE
          type: Release
        - version: REL_15_STABLE
          type: Release
        - version: REL_16_STABLE
          type: Release
        - version: REL_17_STABLE
          type: Release
        - version: REL_18_STABLE
          type: Debug
        - version: REL_18_STABLE
          type: ReleaseStatic
        - version: REL_19_STABLE
          type: ReleaseStaticSystem

    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}

    steps:
      - name: Test details
        run: echo Build and test pg_duckdb with PostgreSQL ${{ matrix.version }} branch

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev \
            libssl-dev libxml2-utils xsltproc pkg-config libc++-dev libc++abi-dev libglib2.0-dev libtinfo6 cmake \
            libstdc++-12-dev ninja-build libcurl4-openssl-dev sqlsmith libsnappy-dev liblzma-dev
          echo "${PWD}/postgres/inst/bin:$PATH'" > $GITHUB_PATH

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ matrix.version }}
          create-symlink: true

      - name: Checkout pg_duckdb extension code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          path: duckdb

      # ReleaseStatic gets openssl and curl from vcpkg
      - name: Setup vcpkg
        if: matrix.type == 'ReleaseStatic'
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

      - name: Use vcpkg for the build
        if: matrix.type == 'ReleaseStatic'
        run: echo "VCPKG_TOOLCHAIN_PATH=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Checkout PostgreSQL code
        run: |
          rm -rf postgres
          git clone --branch ${{ matrix.version }} --single-branch --depth 1 https://github.com/postgres/postgres.git

      - name: Compute Version SHAs
        id: versions
        run: |
          pushd duckdb/third_party/duckdb
          DUCKDB_SHA=`git rev-parse HEAD`
          echo "duckdb_sha=${DUCKDB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got DUCKDB_SHA='${DUCKDB_SHA}'"
          popd
          pushd postgres
          POSTGRES_SHA=`git rev-parse HEAD`
          echo "postgres_sha=${POSTGRES_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got POSTGRES_SHA='${POSTGRES_SHA}'"

      - name: Setup PG build cache
        id: cache-pg-build
        uses: actions/cache@v6
        with:
          path: postgres/inst
          key: pg-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.postgres_sha }}-postgres_fdw

      - name: Build PostgreSQL code
        if: steps.cache-pg-build.outputs.cache-hit != 'true'
        working-directory: postgres
        run: |
          ./configure --prefix=$PWD/inst/ --enable-cassert --enable-debug --with-openssl --with-icu --with-libxml --with-lz4
          make -j8 install
          make -C contrib/postgres_fdw install

      - name: Setup DuckDB build cache
        id: cache-duckdb-build
        uses: actions/cache@v6
        with:
          path: duckdb/third_party/duckdb/build/
          key: duckdb-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.duckdb_sha }}-${{ matrix.type }}-${{ hashFiles('duckdb/Makefile', 'duckdb/third_party/pg_duckdb_extensions.cmake') }}-cmake4-ninja

      - name: Install pytest and other test requirements
        run: python -m pip install --user --break-system-packages -r duckdb/requirements.txt

      # The CMake 3.28 of Ubuntu 24.04 does not raise the policies of the old CMake projects avro uses (jansson), so it
      # ignores the hidden symbol visibility of jansson, see third_party/pg_duckdb_extensions.cmake
      - name: Install CMake 4
        run: python -m pip install --user --break-system-packages 'cmake>=4.0,<5'

      - name: Add user pip to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build pg_duckdb extension
        id: build
        working-directory: duckdb
        run: ERROR_ON_WARNING=1 make -j8 install DUCKDB_BUILD=${{ matrix.type }}

      - name: Run make installcheck
        id: installcheck
        working-directory: duckdb
        run: make installcheck DUCKDB_BUILD=${{ matrix.type }}

      - name: Run make pycheck
        id: pycheck
        working-directory: duckdb
        run: make pycheck DUCKDB_BUILD=${{ matrix.type }}

      - name: Print regression.diffs if regression tests failed
        if: failure() && steps.installcheck.outcome == 'failure'
        # Always "fail" this task by adding "&& false", so that rits output
        # gets expanded in the github UI.
        run: cat duckdb/test/regression/regression.diffs && false

      - name: Print postmaster.log if regression tests failed
        if: failure() && steps.installcheck.outcome == 'failure'
        run: cat duckdb/test/regression/log/postmaster.log

  test-sanitizers:
    name: "Test with ${{ matrix.sanitizer }} sanitizer"
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]

    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}

    env:
      PG_VERSION: REL_18_STABLE
      # Postgres, DuckDB and pg_duckdb are all built with this Clang, which links its sanitizer runtime into the
      # postgres executable for the sanitized shared libraries to use. GCC 13 can't be used with TSan: its runtime
      # doesn't run signal handlers while a thread waits for a mutex, which deadlocks the parallel scan tests.
      CLANG_VERSION: 20
      # Every sanitized program writes its reports to a file in this directory, which the last steps
      # print and upload. The options are set for the whole job, because the builds run sanitized programs too
      # (e.g. pg_config and zic). Postgres intentionally doesn't free memory at exit, so LeakSanitizer is
      # disabled, and detect_stack_use_after_return breaks the stack depth checks of Postgres. TSan must not
      # change the exit code of a backend, as Postgres would treat that as a crash, and it has to allow fork()
      # in a backend that started DuckDB threads (e.g. COPY ... TO PROGRAM). The TSan suppressions are explained in
      # the file.
      SANITIZER_LOG_DIR: ${{ github.workspace }}/sanitizer-logs
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:detect_stack_use_after_return=0:log_path=${{ github.workspace }}/sanitizer-logs/asan
      TSAN_OPTIONS: exitcode=0:die_after_fork=0:second_deadlock_stack=1:log_path=${{ github.workspace }}/sanitizer-logs/tsan:suppressions=${{ github.workspace }}/duckdb/test/tsan_suppressions.txt

    steps:
      - name: Test details
        run: echo Build and test pg_duckdb with PostgreSQL $PG_VERSION branch and ${{ matrix.sanitizer }} sanitizer

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev \
            libssl-dev libxml2-utils xsltproc pkg-config libc++-dev libc++abi-dev libglib2.0-dev libtinfo6 cmake \
            libstdc++-12-dev ninja-build libcurl4-openssl-dev sqlsmith libsnappy-dev liblzma-dev
          echo "${PWD}/postgres/inst/bin" >> $GITHUB_PATH
          mkdir -p "$SANITIZER_LOG_DIR"

      # From apt.llvm.org, because the Clang 18 of Ubuntu 24.04 has the same TSan problem as GCC 13
      - name: Install Clang
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$CLANG_VERSION main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-$CLANG_VERSION libclang-rt-$CLANG_VERSION-dev

      # Older sanitizer runtimes can't handle the default ASLR entropy of the Ubuntu 24.04 runners
      - name: Reduce ASLR entropy for the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ env.PG_VERSION }}-${{ matrix.sanitizer }}-clang-${{ env.CLANG_VERSION }}
          create-symlink: true

      - name: Checkout pg_duckdb extension code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          path: duckdb

      - name: Checkout PostgreSQL code
        run: |
          rm -rf postgres
          git clone --branch $PG_VERSION --single-branch --depth 1 https://github.com/postgres/postgres.git

      - name: Compute Version SHAs
        id: versions
        run: |
          pushd duckdb/third_party/duckdb
          DUCKDB_SHA=`git rev-parse HEAD`
          echo "duckdb_sha=${DUCKDB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got DUCKDB_SHA='${DUCKDB_SHA}'"
          popd
          pushd postgres
          POSTGRES_SHA=`git rev-parse HEAD`
          echo "postgres_sha=${POSTGRES_SHA}" >> "$GITHUB_OUTPUT"
          echo "Got POSTGRES_SHA='${POSTGRES_SHA}'"

      - name: Setup PG build cache
        id: cache-pg-build
        uses: actions/cache@v6
        with:
          path: postgres/inst
          key: pg-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.postgres_sha }}-postgres_fdw-${{ matrix.sanitizer }}-clang-${{ env.CLANG_VERSION }}

      - name: Build PostgreSQL code
        if: steps.cache-pg-build.outputs.cache-hit != 'true'
        working-directory: postgres
        run: |
          SANITIZE="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
          ./configure --prefix=$PWD/inst/ --enable-cassert --enable-debug --with-openssl --with-icu --with-libxml --with-lz4 \
            CC=clang-$CLANG_VERSION CXX=clang++-$CLANG_VERSION CFLAGS="-O1 $SANITIZE" CXXFLAGS="-O1 $SANITIZE" LDFLAGS="$SANITIZE"
          make -j8 install
          make -C contrib/postgres_fdw install

      - name: Setup DuckDB build cache
        id: cache-duckdb-build
        uses: actions/cache@v6
        with:
          path: duckdb/third_party/duckdb/build/
          key: duckdb-build-${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}-${{ steps.versions.outputs.duckdb_sha }}-Release-${{ matrix.sanitizer }}-clang-${{ env.CLANG_VERSION }}-${{ hashFiles('duckdb/Makefile', 'duckdb/third_party/pg_duckdb_extensions.cmake') }}-cmake4-ninja

      - name: Install pytest and other test requirements
        run: python -m pip install --user --break-system-packages -r duckdb/requirements.txt

      # The CMake 3.28 of Ubuntu 24.04 does not raise the policies of the old CMake projects avro uses (jansson), so it
      # ignores the hidden symbol visibility of jansson, see third_party/pg_duckdb_extensions.cmake
      - name: Install CMake 4
        run: python -m pip install --user --break-system-packages 'cmake>=4.0,<5'

      - name: Add user pip to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # pg_duckdb gets the compiler and the sanitizer flags from the Postgres build. With DUCKDB_SANITIZER, DuckDB
      # is built with the same compiler and sanitizer. Warnings are checked by the build-and-test job.
      - name: Build pg_duckdb extension
        id: build
        working-directory: duckdb
        run: make -j8 install DUCKDB_SANITIZER=${{ matrix.sanitizer }}

      - name: Run make installcheck
        id: installcheck
        working-directory: duckdb
        run: make installcheck DUCKDB_SANITIZER=${{ matrix.sanitizer }}

      # The tests of each xdist worker already run parallel scans and DuckDB threads, so more workers would only
      # compete for the CPUs with them
      - name: Run make pycheck
        id: pycheck
        if: success() || steps.installcheck.outcome == 'failure'
        working-directory: duckdb
        run: make pycheck DUCKDB_SANITIZER=${{ matrix.sanitizer }} PYTEST_CONCURRENCY=4

      - name: Print regression.diffs if regression tests failed
        if: failure() && steps.installcheck.outcome == 'failure'
        run: cat duckdb/test/regression/regression.diffs && false

      - name: Print postmaster.log if regression tests failed
        if: failure() && steps.installcheck.outcome == 'failure'
        run: cat duckdb/test/regression/log/postmaster.log

      - name: Print sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=("$SANITIZER_LOG_DIR"/*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No sanitizer reports"
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "::group::$(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done
          echo "::error::${#reports[@]} sanitizer report file(s), see the groups above or the sanitizer-reports artifact"
          exit 1

      - name: Upload sanitizer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-reports-${{ matrix.sanitizer }}
          path: sanitizer-logs/
          if-no-files-found: ignore
